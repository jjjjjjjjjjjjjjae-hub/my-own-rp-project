<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>MY KAZAKH RP</title>
                <style>
                        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }

                                        /* Splash Screen */
                                                #splash {
                                                	            position: fixed; width: 100%; height: 100%; background: #000;
                                                	                        display: flex; flex-direction: column; justify-content: center; align-items: center;
                                                	                                    z-index: 999; transition: opacity 1s;
                                                	                                            }
                                                	                                                    #logo {
                                                	                                                    	            color: #ffd700; font-family: sans-serif; font-size: 35px;
                                                	                                                    	                        font-weight: bold; letter-spacing: 8px;
                                                	                                                    	                                    animation: pulse 2s infinite;
                                                	                                                    	                                            }
                                                	                                                    	                                                    @keyframes pulse {
                                                	                                                    	                                                    	            0% { transform: scale(1); opacity: 0.7; }
                                                	                                                    	                                                    	                        50% { transform: scale(1.05); opacity: 1; }
                                                	                                                    	                                                    	                                    100% { transform: scale(1); opacity: 0.7; }
                                                	                                                    	                                                    	                                            }
                                                	                                                    	                                                    	                                                </style>
                                                	                                                    	                                                    	                                                </head>
                                                	                                                    	                                                    	                                                <body>

                                                	                                                    	                                                    	                                                    <div id="splash">
                                                	                                                    	                                                    	                                                            <div id="logo">MY KAZAKH RP</div>
                                                	                                                    	                                                    	                                                                    <p style="color: #444; margin-top: 20px;">Жүктелуде...</p>
                                                	                                                    	                                                    	                                                                        </div>

                                                	                                                    	                                                    	                                                                            <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

                                                	                                                    	                                                    	                                                                                    <script>
                                                	                                                    	                                                    	                                                                                            // Анимацияны 3 секундтан кейін өшіру
                                                	                                                    	                                                    	                                                                                                    setTimeout(() => {
                                                	                                                    	                                                    	                                                                                                    	            document.getElementById('splash').style.opacity = '0';
                                                	                                                    	                                                    	                                                                                                    	                        setTimeout(() => document.getElementById('splash').remove(), 1000);
                                                	                                                    	                                                    	                                                                                                    	                                }, 3000);

                                                	                                                    	                                                    	                                                                                                    	                                        // 3D Негізі
                                                	                                                    	                                                    	                                                                                                    	                                                const scene = new THREE.Scene();
                                                	                                                    	                                                    	                                                                                                    	                                                        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                                                	                                                    	                                                    	                                                                                                    	                                                                const renderer = new THREE.WebGLRenderer({ antialias: true });
                                                	                                                    	                                                    	                                                                                                    	                                                                        renderer.setSize(window.innerWidth, window.innerHeight);
                                                	                                                    	                                                    	                                                                                                    	                                                                                document.body.appendChild(renderer.domElement);

                                                	                                                    	                                                    	                                                                                                    	                                                                                        // Уақытша жарық пен фон
                                                	                                                    	                                                    	                                                                                                    	                                                                                                scene.background = new THREE.Color(0x111111);
                                                	                                                    	                                                    	                                                                                                    	                                                                                                        const light = new THREE.AmbientLight(0xffffff, 0.5);
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                scene.add(light);

                                                	                                                    	                                                    	                                                                                                    	                                                                                                                        camera.position.z = 5;

                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                function animate() {
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                	            requestAnimationFrame(animate);
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                	                        renderer.render(scene, camera);
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                	                                }
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                	                                        animate();
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                	                                            </script>
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                	                                            </body>
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                	                                            </html>
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                	                                            
                                                	                                                    	                                                    	                                                                                                    	                                                                                                                                }
                                                	                                                    	                                                    	                                                                                                    })
                                                	                                                    	                                                    }
                                                	                                                    }
                                                }
