name: Build Almas Net Optimizer MAX
on:
  push:
    branches: [ main ]
    paths:
      - 'almas-net-max/**'
      - '.github/workflows/almas-net-max.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p almas-net-max assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almas-Net-Optimizer-MAX-v2
          path: almas-net-max/app/build/outputs/apk/debug/app-debug.apk
