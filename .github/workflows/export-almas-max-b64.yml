name: Export ALMAS TELEKOM APK
on:
  push:
    branches: [ main ]
    paths:
      - 'almas-net-max/**'
      - '.github/workflows/export-almas-max-b64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p almas-net-max assembleDebug --stacktrace
      - name: Export direct APK
        run: |
          mkdir -p generated
          cp almas-net-max/app/build/outputs/apk/debug/app-debug.apk generated/ALMAS-TELEKOM-v4.apk
      - name: Commit direct APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/ALMAS-TELEKOM-v4.apk
          git commit -m 'Publish ALMAS TELEKOM v4 APK' || exit 0
          git push
