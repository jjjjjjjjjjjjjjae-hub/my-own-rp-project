name: Export ALMAS TELEKOM APK
on:
  push:
    branches: [ main ]
    paths:
      - 'almas-net-max/**'
      - '.github/workflows/export-almas-max-b64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      ALMAS_SIGNING_KEY_B64: ${{ secrets.ALMAS_SIGNING_KEY_B64 }}
      ALMAS_KEYSTORE_PASSWORD: ${{ secrets.ALMAS_KEYSTORE_PASSWORD }}
      ALMAS_KEY_ALIAS: ${{ secrets.ALMAS_KEY_ALIAS }}
      ALMAS_KEY_PASSWORD: ${{ secrets.ALMAS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        shell: bash
        run: |
          if [ -n "$ALMAS_SIGNING_KEY_B64" ]; then
            echo "$ALMAS_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/almas-release.jks"
            echo "ALMAS_KEYSTORE_PATH=$RUNNER_TEMP/almas-release.jks" >> "$GITHUB_ENV"
            echo "ALMAS_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "ALMAS_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        run: |
          if [ "$ALMAS_SIGNED_RELEASE" = "true" ]; then
            gradle -p almas-net-max assembleRelease --stacktrace
            echo "APK_PATH=almas-net-max/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "WARNING: release signing secrets are missing; building debug APK."
            gradle -p almas-net-max assembleDebug --stacktrace
            echo "APK_PATH=almas-net-max/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Export APK and update manifest
        shell: bash
        run: |
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" almas-net-max/app/build.gradle | head -n1)
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" almas-net-max/app/build.gradle | head -n1)
          APK_NAME="ALMAS-TELEKOM-v${VERSION_CODE}.apk"

          mkdir -p generated
          cp "$APK_PATH" "generated/$APK_NAME"

          SHA256=$(sha256sum "generated/$APK_NAME" | awk '{print $1}')
          cat > generated/almas-telekom-update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://raw.githubusercontent.com/jjjjjjjjjjjjjjae-hub/my-own-rp-project/main/generated/${APK_NAME}",
            "sha256": "${SHA256}",
            "signedRelease": ${ALMAS_SIGNED_RELEASE},
            "notes": "ALMAS TELEKOM v${VERSION_NAME}: нақты Auto Update Engine қосылды. Қолданба жаңа нұсқаны өзі тексереді, APK-ны жүктейді және Android орнатқышын ашады."
          }
          EOF

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Commit direct APK and update manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "generated/$APK_NAME" generated/almas-telekom-update.json
          git commit -m "Publish ALMAS TELEKOM v5 auto-update APK" || exit 0
          git push
